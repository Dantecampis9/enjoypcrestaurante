<!DOCTYPE html>
<!--
  Portal cautivo — Hotspot MikroTik RouterOS — Enjoy Punta Cana

  Este archivo NO es una página normal: RouterOS lo sirve directamente
  desde su Hotspot (IP > Hotspot > Server Profiles > carpeta del skin,
  normalmente /hotspot/) y sustituye las variables $(...) él mismo antes
  de enviarlo al navegador del visitante. No funciona si lo abres
  directo con doble clic — necesita ser servido por el router.

  Requisitos en el router (ver mikrotik/README.md para el detalle):
  1. El perfil de usuario del Hotspot debe tener "Trial" habilitado
     (así "T-$(mac-esc)" concede acceso sin usuario/clave reales).
  2. El dominio de Supabase debe estar en el Walled Garden, o el fetch()
     de abajo nunca podrá completarse (el dispositivo no tiene internet
     hasta que este formulario lo autentica).
  3. Subir junto a este archivo: style.css, banner.jpg y la carpeta
     fonts/ (todo dentro de esta misma carpeta mikrotik/).
  4. Este archivo asume que el servidor Hotspot NO usa CHAP como método
     de login (confirmado: "HTTP CHAP" desmarcado en Server Profiles,
     solo Cookie + Trial activos) — por eso no incluye md5.js ni el
     campo $(chap-id). Si algún día se activa CHAP en el router, hay
     que volver a añadir ese soporte o el login fallará con
     "web browser did not send challenge response".

  Nombre/correo son solo para captura de contactos (marketing) — la
  variable que de verdad concede la red es el username "T-$(mac-esc)"
  del formulario oculto de abajo, no estos campos visibles.
-->
<html lang="es" id="html-root">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enjoy Punta Cana | WiFi</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="card">
    <div class="banner"></div>

    <div class="body">
      <div class="lang-toggle">
        <button type="button" data-lang="es" class="lang-btn">ES</button>
        <button type="button" data-lang="en" class="lang-btn">EN</button>
      </div>

      <h1 class="title" data-i18n="title">Enjoy PC / Corales Pizzeria Cigar, Sushi y Lounge</h1>
      <p class="subtitle" data-i18n="subtitle">Sumérgete en una experiencia donde el lujo se encuentra con la esencia del Caribe. Déjanos tus datos para conectarte al WiFi.</p>

      $(if error)
      <div class="server-error"><span data-i18n="errorLabel">Error</span>: $(error)</div>
      $(endif)

      <!-- Formulario oculto: es el que MikroTik reconoce para autenticar.
           "T-$(mac-esc)" es la convención estándar de RouterOS para un
           login de tipo "Trial" (acceso libre tras aceptar, sin
           usuario/clave reales). Requiere Trial habilitado en el
           perfil de usuario del servidor Hotspot. -->
      <form name="sendin" action="$(link-login-only)" method="post" id="hotspot-form">
        <input type="hidden" name="dst" value="https://dantecampis9.github.io/enjoypcrestaurante/" />
        <!-- ⬆️ Sitio publicado en GitHub Pages. Si más adelante se pasa a
             un dominio propio (ej. enjoypcrestaurante.com), actualizar aquí.
             Alternativa: usar value="$(link-orig-esc)" para devolver al
             visitante a la página que intentaba abrir originalmente. -->
        <input type="hidden" name="popup" value="$(popup)" />
        <input type="hidden" name="username" value="T-$(mac-esc)" />
      </form>

      <!-- Formulario visible: solo captura nombre/correo/teléfono para la
           base de contactos del restaurante. No autentica nada por sí mismo. -->
      <form id="lead-form" novalidate>
        <div class="field">
          <input id="lead-name" name="name" type="text" data-i18n-placeholder="namePlaceholder" placeholder="Nombre completo" autocomplete="name" maxlength="120" required />
        </div>
        <div class="field">
          <input id="lead-email" name="email" type="email" data-i18n-placeholder="emailPlaceholder" placeholder="Correo electrónico" autocomplete="email" maxlength="255" required />
        </div>
        <div class="field">
          <input id="lead-phone" name="phone" type="tel" inputmode="tel" data-i18n-placeholder="phonePlaceholder" placeholder="Número de teléfono" autocomplete="tel" maxlength="20" required />
        </div>
        <p id="lead-error" class="error-text" data-i18n="formError">Ingresa tu nombre, un correo y un teléfono válidos.</p>
        <button type="submit" id="lead-submit" class="btn-accept" data-i18n="accept">Aceptar y Continuar</button>
      </form>

      <div class="terms">
        <a href="#" data-i18n="terms">Términos y Condiciones</a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // ---------------------------------------------------------------
      // Idioma ES/EN — independiente del sitio principal a propósito:
      // esta página la sirve el router desde su propia carpeta, sin
      // acceso a js/i18n.js del sitio (el visitante ni siquiera tiene
      // internet todavía). Diccionario mínimo, auto-contenido.
      // ---------------------------------------------------------------
      var DICT = {
        es: {
          title: "Enjoy PC / Corales Pizzeria Cigar, Sushi y Lounge",
          subtitle: "Sumérgete en una experiencia donde el lujo se encuentra con la esencia del Caribe. Déjanos tus datos para conectarte al WiFi.",
          errorLabel: "Error",
          namePlaceholder: "Nombre completo",
          emailPlaceholder: "Correo electrónico",
          phonePlaceholder: "Número de teléfono",
          formError: "Ingresa tu nombre, un correo y un teléfono válidos.",
          accept: "Aceptar y Continuar",
          connecting: "Conectando…",
          terms: "Términos y Condiciones",
        },
        en: {
          title: "Enjoy PC / Corales Pizzeria Cigar, Sushi & Lounge",
          subtitle: "Immerse yourself in an experience where luxury meets the essence of the Caribbean. Leave us your details to connect to WiFi.",
          errorLabel: "Error",
          namePlaceholder: "Full name",
          emailPlaceholder: "Email address",
          phonePlaceholder: "Phone number",
          formError: "Please enter a valid name, email and phone number.",
          accept: "Accept and Continue",
          connecting: "Connecting…",
          terms: "Terms and Conditions",
        },
      };

      var LANG_KEY = "enjoy-hotspot-lang";

      function detectLang() {
        var saved = localStorage.getItem(LANG_KEY);
        if (saved === "es" || saved === "en") return saved;
        return navigator.language && navigator.language.toLowerCase().indexOf("en") === 0 ? "en" : "es";
      }

      function translate(key, lang) {
        return (DICT[lang] && DICT[lang][key]) || DICT.es[key] || key;
      }

      function applyLang(lang) {
        document.getElementById("html-root").lang = lang;

        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          el.textContent = translate(el.getAttribute("data-i18n"), lang);
        });
        document.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) {
          el.setAttribute("placeholder", translate(el.getAttribute("data-i18n-placeholder"), lang));
        });
        document.querySelectorAll(".lang-btn").forEach(function (btn) {
          btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
        });

        currentLang = lang;
      }

      var currentLang = detectLang();

      document.querySelectorAll(".lang-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var lang = btn.getAttribute("data-lang");
          localStorage.setItem(LANG_KEY, lang);
          applyLang(lang);
        });
      });

      applyLang(currentLang);

      // ---------------------------------------------------------------
      // Captura de contacto + envío del login real (ver comentarios
      // arriba en el HTML: dos formularios separados a propósito).
      // ---------------------------------------------------------------

      // Mismo proyecto Supabase que usa el sitio web (tabla `leads`,
      // protegida por RLS: INSERT público, SELECT solo administradores).
      // La clave "publishable" es segura para exponer aquí — no es un
      // secreto, ver sql/README.md del proyecto principal.
      var SUPABASE_URL = "https://buxkahmxaubgygsbreze.supabase.co";
      var SUPABASE_ANON_KEY = "sb_publishable_Ye6rfsrZxf9q7xLqwuP-CA_PQfBwSeS";
      var SAVE_TIMEOUT_MS = 3000; // corto a propósito: nunca debe demorar el acceso a la red

      // Letras (incluye acentos/ñ), espacios, apóstrofe y guion — mismo
      // conjunto que se filtra en vivo en #lead-name más abajo.
      // OJO: "À-ÖØ-öø-ÿ" (no "À-ÿ" de un tirón) porque el rango Latin-1
      // completo cuela de colado los símbolos × (U+00D7) y ÷ (U+00F7),
      // que caen justo entre letras acentuadas y no son letras.
      var NAME_LETTERS = "A-Za-zÀ-ÖØ-öø-ÿĀ-ſ";
      var NAME_CHARS = NAME_LETTERS + "\\s'-";
      var NAME_DISALLOWED_RE = new RegExp("[^" + NAME_CHARS + "]", "g");

      function isValidName(v) {
        var trimmed = v.trim();
        if (trimmed.length < 2 || trimmed.length > 120) return false;
        if (!new RegExp("^[" + NAME_CHARS + "]+$").test(trimmed)) return false;
        // Al menos una letra real: rechaza "- -" o "'''" como nombre.
        return new RegExp("[" + NAME_LETTERS + "]").test(trimmed);
      }

      function isValidEmail(v) {
        var trimmed = v.trim();
        if (trimmed.length > 255) return false;
        if (trimmed.indexOf("..") !== -1) return false;
        // local@dominio.tld — sin espacios, TLD de al menos 2 letras.
        return /^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,24}$/.test(trimmed);
      }

      // Dígitos, espacios, +, -, ( ) — con o sin código de país. Mismo
      // conjunto que se filtra en vivo en #lead-phone más abajo.
      var PHONE_DISALLOWED_RE = /[^0-9+()\s-]/g;

      function isValidPhone(v) {
        var trimmed = v.trim();
        // Valida solo por cantidad de dígitos (7 a 15, rango internacional
        // razonable), no por un formato dominicano específico.
        if (!/^[0-9+()\s-]+$/.test(trimmed)) return false;
        var digits = trimmed.replace(/\D/g, "");
        return digits.length >= 7 && digits.length <= 15;
      }

      // Elimina en tiempo real cualquier carácter fuera del conjunto
      // permitido, sin dejar que el cursor salte al final del campo.
      function restrictInput(el, disallowedRe) {
        el.addEventListener("input", function () {
          var start = el.selectionStart;
          var before = el.value;
          var after = before.replace(disallowedRe, "");
          if (before !== after) {
            var diff = before.length - after.length;
            el.value = after;
            var pos = Math.max(0, (start || 0) - diff);
            el.setSelectionRange(pos, pos);
          }
        });
      }

      function saveLead(nombre, email, telefono) {
        if (!window.fetch || !window.AbortController) return Promise.resolve();

        var controller = new AbortController();
        var timer = setTimeout(function () { controller.abort(); }, SAVE_TIMEOUT_MS);

        return fetch(SUPABASE_URL + "/rest/v1/leads", {
          method: "POST",
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: "Bearer " + SUPABASE_ANON_KEY,
            "Content-Type": "application/json",
            // Sin esta cabecera, PostgREST hace INSERT ... RETURNING *,
            // lo que activa las políticas de SELECT (que el visitante no
            // tiene) y el guardado fallaría. Ver sql/02-rls.sql.
            Prefer: "return=minimal",
          },
          body: JSON.stringify({
            nombre: nombre,
            email: email,
            telefono: telefono,
            origen: "mikrotik-hotspot",
            mac: "$(mac-esc)",
            timestamp: new Date().toISOString(),
          }),
          signal: controller.signal,
        }).catch(function (err) {
          // Si Supabase no es alcanzable (walled garden mal puesto, sin
          // internet en el router, proyecto pausado), no pasa nada: el
          // visitante igual debe poder conectarse al WiFi.
          console.warn("No se pudo guardar el contacto en Supabase (no afecta el acceso al WiFi):", err);
        }).finally(function () {
          clearTimeout(timer);
        });
      }

      document.getElementById("lead-form").addEventListener("submit", function (e) {
        e.preventDefault();

        var nombre = document.getElementById("lead-name").value.trim();
        var email = document.getElementById("lead-email").value.trim();
        var telefono = document.getElementById("lead-phone").value.trim();
        var errorEl = document.getElementById("lead-error");
        var submitBtn = document.getElementById("lead-submit");

        if (!nombre || !isValidEmail(email) || !isValidPhone(telefono)) {
          errorEl.classList.add("visible");
          return;
        }
        errorEl.classList.remove("visible");

        submitBtn.disabled = true;
        submitBtn.textContent = translate("connecting", currentLang);

        // Intenta guardar el contacto, pero SIEMPRE concede la red al
        // terminar (éxito, fallo o timeout) — nunca deja al visitante
        // atrapado en esta pantalla por un problema de red ajeno a él.
        saveLead(nombre, email, telefono).then(function () {
          document.sendin.submit();
        });
      });
    })();
  </script>
</body>
</html>
